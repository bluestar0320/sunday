<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>같이걸을개</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" aria-label="뒤로" hidden></button>
      <h1 id="title">같이걸을개</h1>
      <span id="topActions"></span>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="discover" data-icon="compass">탐색</button>
      <button data-tab="matches" data-icon="chat">대화</button>
      <button data-tab="walks" data-icon="calendar">산책</button>
      <button data-tab="profile" data-icon="user">MY</button>
    </nav>

    <input type="file" id="fileInput" accept="image/*" multiple hidden />
    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modal" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
