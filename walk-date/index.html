<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF8A5B" />
  <title>같이걸을개 — 산책으로 시작하는 만남</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="뒤로" hidden>←</button>
      <h1 id="title">같이걸을개</h1>
      <button class="icon-btn" id="filterBtn" aria-label="필터">⚙︎</button>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="discover" class="active"><span>🐾</span>탐색</button>
      <button data-tab="matches"><span>💬</span>매칭</button>
      <button data-tab="walks"><span>📅</span>산책 일정</button>
      <button data-tab="profile"><span>🙂</span>내 프로필</button>
    </nav>

    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modal" hidden><div class="modal" id="modalBody"></div></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
