<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E4EFE9" />
  <title>같이걸을개</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="fonts/gowun-dodum/gowun-dodum.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="breeze" aria-hidden="true">
      <div class="sun"></div>
      <span class="leaf"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Z" fill="#A9C9A4"/><path d="M5 19 14 10" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      <span class="leaf"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Z" fill="#F2B49C"/><path d="M5 19 14 10" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      <span class="leaf"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Z" fill="#C5DDB5"/><path d="M5 19 14 10" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      <span class="leaf"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Z" fill="#9BBF9F"/><path d="M5 19 14 10" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      <span class="leaf"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15Z" fill="#F6CBA8"/><path d="M5 19 14 10" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/></svg></span>
    </div>
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" aria-label="뒤로" hidden></button>
      <h1 id="title">같이걸을개</h1>
      <span id="topActions"></span>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="discover" data-icon="paw">탐색</button>
      <button data-tab="matches" data-icon="chat">대화</button>
      <button data-tab="walks" data-icon="calendar">산책</button>
      <button data-tab="profile" data-icon="user">MY</button>
    </nav>

    <input type="file" id="fileInput" accept="image/*" multiple hidden />
    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modal" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
